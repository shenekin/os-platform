# Network Configuration File
# Modify the following variable values and then run the main script

# ===== Hostname Configuration =====
HOSTNAME="k8s-node-05"

# ===== Network Interface Configuration =====
# Network interface name to configure (use 'ip a' to check)
INTERFACE="ens18"

# IP address and subnet mask
IP_ADDRESS="10.168.2.107"
NETMASK="255.255.255.0"
# Or use CIDR format, script will automatically calculate NETMASK
# CIDR="24"

# Gateway address
GATEWAY="10.168.2.1"

# DNS servers (separate multiple DNS with spaces)
# DNS_SERVERS="10.168.2.1 114.114.114.114"
DNS_SERVERS="10.168.2.1"

# ===== Hosts Resolution Configuration (Optional) =====
# Whether to update hosts file (yes/no)
UPDATE_HOSTS="yes"

# Hostname to IP mapping list (format: hostname:IP, one per line)
# Supports adding multiple mapping records
HOSTS_ENTRIES=(
    "k8s-master-01:10.168.2.100"
    "k8s-master-02:10.168.2.101"
    "k8s-master-03:10.168.2.102"
    "k8s-node-01:10.168.2.103"
    "k8s-node-02:10.168.2.104"
    "k8s-node-03:10.168.2.105"
    "k8s-node-04:10.168.2.106"
    "k8s-node-05:10.168.2.107"
)

# ===== Network Configuration Method =====
# Use netplan configuration (Ubuntu 24 default method)
USE_NETPLAN="yes"