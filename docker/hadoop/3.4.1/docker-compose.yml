services:
  namenode:
    image: ekinshen/hadoop-with-configuration:3.4.1
    container_name: namenode
    hostname: namenode
    network_mode: host
    environment:
      - HADOOP_NODE_TYPE=namenode
      - HDFS_NAMENODE_HOSTNAME=localhost
      - JAVA_HOME=/opt/java/openjdk
    volumes:
      - namenode-data:/hadoop/dfs/name
      - ./hadoop-entrypoint.sh:/hadoop-entrypoint.sh:ro
    entrypoint: /hadoop-entrypoint.sh
    restart: unless-stopped

  datanode1:
    image: ekinshen/hadoop-with-configuration:3.4.1
    container_name: datanode1
    hostname: datanode1
    network_mode: host
    environment:
      - HADOOP_NODE_TYPE=datanode
      - HDFS_NAMENODE_HOSTNAME=localhost
      - JAVA_HOME=/opt/java/openjdk
    volumes:
      - datanode1-data:/hadoop/dfs/data
      - ./hadoop-entrypoint.sh:/hadoop-entrypoint.sh:ro
    entrypoint: /hadoop-entrypoint.sh
    depends_on:
      - namenode
    restart: unless-stopped

  datanode2:
    image: ekinshen/hadoop-with-configuration:3.4.1
    container_name: datanode2
    hostname: datanode2
    network_mode: host
    environment:
      - HADOOP_NODE_TYPE=datanode
      - HDFS_NAMENODE_HOSTNAME=localhost
      - JAVA_HOME=/opt/java/openjdk
    volumes:
      - datanode2-data:/hadoop/dfs/data
      - ./hadoop-entrypoint.sh:/hadoop-entrypoint.sh:ro
    entrypoint: /hadoop-entrypoint.sh
    depends_on:
      - namenode
    restart: unless-stopped

volumes:
  namenode-data:
  datanode1-data:
  datanode2-data:
