#  Redis 5 tested
# ======================================
# Basic Configuration (Required)  
# ======================================
# Bind to localhost (restrict network access to local apps; use 0.0.0.0 for remote access)
bind 0.0.0.0

# Port to listen on (default: 6379)
port 6379

# Unix socket (optional, faster than TCP for local apps)
#unixsocket /var/run/redis/redis-server.sock
#unixsocketperm 770  # Allow read/write for Redis group

# Daemonize Redis (run in background)
daemonize no

# PID file path
pidfile /var/run/redis/redis-server.pid

# Log file path (replace with your preferred location)
#logfile /var/log/redis-server.log

# Log level (debug, verbose, notice, warning)
loglevel notice

# Database count (default: 16; use 1 if you don't need multiple DBs)
databases 16

# ======================================
# Security Hardening (Critical)
# ======================================
# Require password for all operations (replace with a strong password)
requirepass '1qaz@WSX'

# Disable dangerous commands (prevent accidental data loss)
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""
rename-command DEBUG ""

# Restrict command execution to authenticated users
protected-mode yes

# ======================================
# Persistence (Choose One or Both)
# ======================================
# RDB: Snapshot data to disk (faster recovery, larger files)
#save 900 1        # Save if 1 key changed in 15 mins
#save 300 10       # Save if 10 keys changed in 5 mins
#save 60 10000     # Save if 10k keys changed in 1 min
#stop-writes-on-bgsave-error yes  # Stop writes if snapshot fails (prevents data inconsistency)
#rdbcompression yes               # Compress RDB files
#rdbchecksum yes                  # Verify RDB integrity on load
#dbfilename dump.rdb              # RDB file name
#dir /var/lib/redis/              # Directory to store RDB/AOF files

# AOF: Append-only file (more durable, smaller files, slower writes)
#appendonly yes                   # Enable AOF
#appendfilename "appendonly.aof"  # AOF file name
#appendfsync everysec             # Sync AOF to disk every second (balance of speed/durability)
# appendfsync always             # Sync after every write (most durable, slowest)
# appendfsync no                 # Let OS handle sync (fastest, least durable)
#auto-aof-rewrite-percentage 100  # Rewrite AOF when file grows by 100%
#auto-aof-rewrite-min-size 64mb   # Min AOF size before rewrite
#aof-load-truncated yes           # Load truncated AOF files (recover partial data)
#aof-use-rdb-preamble yes         # Mix RDB and AOF (faster recovery, smaller files)

# ======================================
# Memory Management (Prevent OOM)
# ======================================
# Max memory limit (set to 50-70% of your available RAM; e.g., 4GB RAM → 2gb)
maxmemory 2gb

# What to do when max memory is reached (choose based on use case)
# - allkeys-lru: Evict least recently used keys (best for caching)
# - volatile-lru: Evict LRU keys with TTL (best for mixed caching/persistence)
# - noeviction: Reject writes (best for persistence-only)
maxmemory-policy allkeys-lru

# Eviction sampling (default: 5; higher = more accurate, slower)
maxmemory-samples 5

# ======================================
# Performance Tweaks
# ======================================
# TCP keepalive (detect dead connections; 300 seconds = 5 mins)
tcp-keepalive 300

# Connection timeout (close idle connections after 300 seconds)
timeout 300

# Threads for I/O (Redis 6+; set to number of CPU cores / 2; e.g., 4 cores → 2)
#io-threads 2
#io-threads-do-reads yes  # Use threads for reads (faster throughput)

# Disable slow log (enable only for debugging)
#slowlog-log-slower-than 10000  # Log commands taking >10ms
#slowlog-max-len 128            # Keep last 128 slow commands

# ======================================
# Advanced (Optional)
# ======================================
# Client output buffer limits (prevent memory leaks from misbehaving clients)
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Hash-max-ziplist settings (optimize small hashes for memory)
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# Set Redis user (Redis 6+; restrict permissions)
#user default on >your_strong_password_here ~* +@all  # Full access (adjust for least privilege)

